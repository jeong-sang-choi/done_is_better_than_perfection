<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>I will</title>
    <link rel="stylesheet" href="css/iwill.css" />
  </head>
  <body>
    <div class="page-bg">
      <div class="card">
        <!-- 상단 탭 -->
        <header class="card-header">
          <nav class="tabs">
            <span>Today</span>
            <span class="active">Progress</span>
            <span>I will</span>
            <span class="login">login</span>
          </nav>
        </header>

        <!-- 본문 -->
        <main class="card-body">
          <!-- 타이틀 -->
          <section class="title">
            <h1>I will</h1>
            <p class="sub-en">The present connects to the future.</p>
            <p class="sub-ko">현재의 선택이 미래로 이어집니다.</p>
          </section>

          <!-- 타임라인 -->
          <section class="timeline">
            <div class="past">
              <strong>Past</strong>
              <span>(records)</span>
            </div>

            <!-- 화살표 -->
            <div class="now-line">
              <span class="dot"></span>
            </div>

            <div class="now">
              <strong>Now</strong>
              <span>(actions)</span>
            </div>
          </section>

          <p class="flow-text">
            Today's actions → <strong>Future</strong><br />
            <span>124 actions flowed upward</span>
          </p>

          <p class="add-line">Add one line to our future</p>

          <div class="input-box">We keep moving forward.</div>

          <!-- 나무 이미지 -->
          <img src="images/i_will.png" class="i_will" alt="i_will" />
        </main>
      </div>
    </div>
  </body>
</html>
