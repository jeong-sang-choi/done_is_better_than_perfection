<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Today</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/today.css" />
  </head>

  <body>
    <!-- 상단 네비 -->
    <header class="top">
      <nav class="nav">
        <span class="nav-item active">Today</span>
        <span class="nav-item">Progress</span>
        <span class="nav-item">I will</span>
      </nav>
    </header>

    <main class="container">
      <section class="today">
        <h1 class="today-title">Today</h1>

        <!-- 입력 영역 -->
        <div class="today-layout">
          <!-- 왼쪽 -->
          <div class="today-left">
            <div class="card goal-card">
              <label class="card-label">
                <input type="checkbox" />
                One-Line Goal
              </label>

              <input
                type="text"
                class="goal-input"
                placeholder="Achieve your main objective in one line..."
              />
            </div>

            <div class="card checklist-card">
              <h2 class="card-title">Today's Checklist</h2>

              <label class="check-item">
                <input type="checkbox" />
                Morning Routine
              </label>
              <label class="check-item">
                <input type="checkbox" />
                Go for a run or do a quick workout
              </label>
              <label class="check-item">
                <input type="checkbox" />
                Study for at least 30 minutes
              </label>
              <label class="check-item">
                <input type="checkbox" />
                Read a book or watch a tutorial
              </label>
            </div>
          </div>

          <!-- 오른쪽 -->
          <div class="today-right">
            <div class="card notes-card">
              <h2 class="card-title">Notes</h2>
              <textarea
                class="notes-textarea"
                placeholder="Write down any thoughts or ideas..."
              ></textarea>
            </div>
          </div>
        </div>
        <!-- today-layout -->

        <!-- ✅ Complete 버튼 (정답 위치) -->
        <div class="complete-wrapper">
          <button class="complete-btn">Complete</button>
        </div>
      </section>
    </main>

    <script src="js/today.js" defer></script>
  </body>
</html>
